# This builds the docker image and tests that it works. Images are pushed on
# main and on tags; pull requests build and test the image without pushing it.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

name: Docker Multiplatform

env:
  REGISTRY_IMAGE: mwatelescope/hyperbeam

jobs:
  build:
    runs-on: ${{ matrix.os }}
    environment: CI
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        # Retry up to 3 times with a delay
        timeout-minutes: 2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: ${{ matrix.platform }}

      - name: Build (pull request, not pushed)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: ${{ env.REGISTRY_IMAGE }}:pr

      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Cache MWA beam file
        id: cache-beam
        uses: actions/cache@v5
        with:
          path: mwa_full_embedded_element_pattern.h5
          key: mwa-beam-file-v1

      - name: Download MWA beam file if cache was a miss
        if: steps.cache-beam.outputs.cache-hit != 'true'
        run: |
          curl -fL \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --retry-max-time 120 \
            https://ws.mwatelescope.org/static/mwa_full_embedded_element_pattern.h5 \
            -o mwa_full_embedded_element_pattern.h5

      - name: test docker image
        env:
          IMAGE: ${{ github.event_name == 'pull_request' && format('{0}:pr', env.REGISTRY_IMAGE) || format('{0}@{1}', env.REGISTRY_IMAGE, steps.build.outputs.digest) }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/mwa_full_embedded_element_pattern.h5:/mwa_full_embedded_element_pattern.h5" \
            -e MWA_BEAM_FILE=/mwa_full_embedded_element_pattern.h5 \
            "$IMAGE" \
            /bin/bash -c "cp /mwa_full_embedded_element_pattern.h5 . && cargo test --release"

  merge:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - build
    outputs:
      container: ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        # Retry up to 3 times with a delay
        timeout-minutes: 2

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
